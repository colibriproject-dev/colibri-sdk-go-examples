apiVersion: 1

# Dashboards do colibri-sdk-go, montados de ../colibri-sdk-go/observability/dashboards.
providers:
  - name: colibri-sdk-go
    folder: Colibri
    type: file
    disableDeletion: true
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards/colibri
